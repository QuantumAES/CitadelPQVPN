[package]
name = "citadel-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CitadelPQVPN — движок Linux-клиента: работает БЕЗ привилегий (uid citadel-vpn), TUN-fd получает от citadel-vpnd по SCM_RIGHTS"

[[bin]]
name = "citadel-engine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
sendfd = "0.4"                                    # приём TUN-fd от демона (SCM_RIGHTS)
citadel-client = { path = "../citadel-client" }   # движок + разбор citadel://-ссылки + Layer-1 токены
citadel-vpnd = { path = "../citadel-vpnd" }       # общий контракт IPC (кадры)
