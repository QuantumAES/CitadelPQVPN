[package]
name = "citadel-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CitadelPQVPN — встраиваемое клиентское ядро (FFI-вуаль поверх citadel-quic) для GUI"

# cdylib — для Android (.so, JNI/flutter_rust_bridge); staticlib — для iOS; rlib — для тестов/Rust.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
citadel-quic = { path = "../citadel-quic" }
citadel-token = { path = "../citadel-token" }   # C5.3: TokenAgent — добыча Layer-1 epoch-токенов у issuer
citadel-winnet = { path = "../citadel-winnet" } # C3-Windows: ядро W2 (IPC/WFP/маршруты), общее со службой
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"        # CBOR byte-string для ключей/хэшей (компактный QR, иначе [u8;32]→массив int)
ciborium = "0.2"            # CBOR (чистый Rust, serde) — формат бандла кред
base64 = "0.22"             # URL_SAFE_NO_PAD для citadel://-ссылки
hex = "0.4"                 # C7.3: client_id ↔ hex для admin-плоскости
sha2 = "0.10"               # SHA-256 обязательства к публичным ключам (§9.3)
aws-lc-rs = "1.17"          # vault: PBKDF2-HMAC-SHA256 + AES-256-GCM (то же ядро крипты, что в движке)
zeroize = "1"               # S1.3/M7: затирание секретов (vault-ключ, plaintext профилей, PSK, seed)
qrcode = { version = "0.14", default-features = false, features = ["svg"] }  # генерация QR (без image-crate)
citadel-tun = { path = "../citadel-tun" }   # GuiTunProvider: Tun::from_raw_fd (Linux-desktop)
# token_agent::fetch_tokens гоняет sync-issuance в spawn_blocking → tokio(rt) нужен на ВСЕХ платформах,
# включая Android (token_agent зовётся из do_android_establish, C5.4). Desktop-таргет ниже добирает
# rt-multi-thread+macros союзом фич (для citadel-diag/#[tokio::main]). Без этого android-сборка ломалась
# «cannot find crate tokio» (латентно с C5.3 — под android не собирали).
tokio = { version = "1", features = ["rt"] }

# SCM_RIGHTS для GuiTunProvider (Linux-desktop). На Android gui_tun компилируется, но не
# используется (TUN даёт VpnService) — dep нужен, чтобы frb_generated.rs собрался под android.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
sendfd = "0.4"

# WindowsTunProvider: CancelIoEx (прервать блокирующий recv на named pipe при реконнекте/disconnect).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_IO"] }

# AdminDeployer (C4): SSH-деплой сервера. russh — чистый Rust (backend aws-lc-rs, тот же, что в
# движке), без OpenSSL-C → не ломает мобильную сборку единым ядром. Admin — десктоп-функция, на
# мобильных (Android/iOS) деплоя нет, поэтому гейт not(mobile): экономит сборку APK от russh.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
russh = "0.61"
# citadel-diag (CLI-прогон диагностики) — desktop/server-only, чтобы tokio-main не тянулся в APK.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
libc = "0.2"
# Интеграционный тест AdminDeployer гоняет in-process russh-сервер (self-contained, без внешнего
# sshd). dev-deps под android не собираются (cargo ndk --lib их не трогает), гейт не нужен.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
