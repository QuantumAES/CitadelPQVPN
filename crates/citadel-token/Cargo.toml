[package]
name = "citadel-token"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CitadelPQVPN — анонимные токены (blind RSA, RFC 9474): per-user unlinkable аутентификация (Privacy Pass-стиль)"

[dependencies]
anyhow = "1"
rand = "0.8"
blind-rsa-signatures = "=0.15.0"   # =0.15.0: 0.15.1+ ломается (derive_more glob → PartialEq ambiguous, E0659)
hex = "0.4"
aws-lc-rs = "1.17"                 # C5.2 Layer-1: Ed25519 (тот же крипто-бэкенд, что в движке)
# S2.1/A1: защищённый (PQ-TLS + pin) канал к издателю. rustls/rcgen/blake3 — те же версии, что в движке.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rcgen = "0.13"
blake3 = "1"
# C7.1 admin-плоскость: CBOR-кадры команд (те же версии, что в citadel-client)
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bin]]
name = "citadel-token"
path = "src/main.rs"

[[bench]]
name = "token"
harness = false
