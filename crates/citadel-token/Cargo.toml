[package]
name = "citadel-token"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CitadelPQVPN — анонимные токены (blind RSA, RFC 9474): per-user unlinkable аутентификация (Privacy Pass-стиль)"

[dependencies]
anyhow = "1"
rand = "0.8"
blind-rsa-signatures = "=0.15.0"   # =0.15.0: 0.15.1+ ломается (derive_more glob → PartialEq ambiguous, E0659)
hex = "0.4"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bin]]
name = "citadel-token"
path = "src/main.rs"

[[bench]]
name = "token"
harness = false
