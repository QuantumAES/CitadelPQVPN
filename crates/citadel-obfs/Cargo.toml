[package]
name = "citadel-obfs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CitadelPQVPN obfs L1 — symmetric PSK-gated datagram wrapping (see docs/PHASE0-OBFS.md)"

[dependencies]
blake3 = "1"
chacha20 = "0.9"
chacha20poly1305 = "0.10"

[dev-dependencies]
hex = "0.4"
# минимум criterion: без plotters/rayon (html/parallel не нужны для замеров)
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "obfs"
harness = false
