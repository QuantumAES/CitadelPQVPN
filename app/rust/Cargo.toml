[package]
name = "rust_lib_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
citadel-client = { path = "../../crates/citadel-client" }
anyhow = "1"
# tokio-runtime для движка (quinn/TLS); features добираются унификацией с citadel-quic.
tokio = { version = "1", features = ["rt-multi-thread"] }

# Android: JNI-мост Rust→VpnService.protect() (анти-петля, C3.3).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
