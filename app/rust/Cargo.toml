[package]
name = "rust_lib_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
citadel-client = { path = "../../crates/citadel-client" }
anyhow = "1"
# tokio-runtime для движка (quinn/TLS); "sync" — для broadcast-шины debug-логов (api::diag).
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

# api::diag — захват process-stderr (dup2/pipe) для debug-логов в UI. Unix-only (Linux+Android).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Android: JNI-мост Rust→VpnService.protect() (анти-петля, C3.3).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
