[workspace]
resolver = "2"
members = ["crates/citadel-obfs", "crates/citadel-masque", "crates/citadel-protect", "crates/citadel-tun", "crates/citadel-token", "crates/citadel-quic", "crates/citadel-client", "crates/citadel-helper", "crates/citadel-winnet", "crates/citadel-winsvc", "crates/citadel-vpnd", "crates/citadel-engine", "crates/citadel-cli"]
# app/rust (rust_lib_app, FFI-мост Flutter) — отдельный крейт вне движкового workspace
# (тянет flutter_rust_bridge; собирается cargokit'ом; citadel-client подключён path-зависимостью).
exclude = ["app/rust"]

[workspace.package]
# Крейты внутренние: на crates.io не публикуются никогда (нет стабильного API, есть path-зависимости).
# Флаг здесь — и страховка от `cargo publish` по ошибке, и то, что позволяет cargo-deny считать
# path-зависимости без версии нормой, а не «wildcard» (L-6, см. deny.toml).
publish = false
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/QuantumAES/CitadelPQVPN"
description = "Постквантовый консьюмерский VPN: гибридный PQ-QUIC + obfs L1 + анонимные токены"
