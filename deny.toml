# cargo-deny — supply-chain гейт (L-6/аудит-4).
#
# До этого файла ответ на вопрос «есть ли в дереве зависимостей известная уязвимость» был
# «неизвестно»: ни cargo-audit, ни cargo-deny не гонялись ни локально, ни в CI, а дерево — это
# ~270 крейтов, среди которых вся крипта (aws-lc-rs, rustls, quinn, argon2) и парсеры недоверенного
# ввода. Здесь проверяются четыре вещи:
#
#   advisories — известные CVE/RUSTSEC и неподдерживаемые (yanked) версии;
#   bans       — pre-release крипто-крейтов (ровно так в дерево попали `ssh-key 0.7.0-rc.10` и
#                `argon2 0.6.0-rc.8` через russh — см. L-7) и дубли одного крейта в разных версиях;
#   licenses   — только разрешительные лицензии (проект отдаётся бинарями);
#   sources    — крейты берутся ТОЛЬКО с crates.io: git-зависимость = код без версии и без аудита.
#
# Запуск: `cargo deny --workspace check` в корне (движок) и в `app/rust` (FRB-мост — отдельный
# воркспейс со своим Cargo.lock, его дерево иначе не проверялось бы вовсе).

[graph]
# Проверяем то, что реально собирается в продукте: Linux (сервер+CLI+GUI), Windows (клиент+служба),
# Android (APK). Прочие таргеты в дереве присутствуют, но в артефакты не попадают.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-linux-android",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Осознанно принятые исключения. Пустой список — намеренно: если появится CVE, гейт должен упасть
# и потребовать РЕШЕНИЯ (обновить, заменить, задокументировать), а не молча пройти. Каждая запись
# здесь обязана нести срок и причину в комментарии.
ignore = [
    # RUSTSEC-2023-0071 «Marvin Attack» (`rsa 0.8.2` через `blind-rsa-signatures`) — ИСКЛЮЧЕНИЕ
    # СНЯТО: крейт ушёл из дерева вместе с blind-RSA. Layer-2 переведён на VOPRF над ristretto255
    # (трек M-6), то есть M-10 закрыт удалением уязвимого кода, а не подавлением предупреждения.
    # RUSTSEC-2024-0436: `paste` (proc-macro) больше не поддерживается. Приходит из `ratatui`
    # (TUI консольного клиента), работает ТОЛЬКО на этапе компиляции и не даёт кода в бинарь;
    # альтернативы у ratatui пока нет. Снять, когда ratatui уйдёт с paste.
    "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"   # дубли версий — сигнал, но не блокер (транзитивные деревья)
wildcards = "deny"           # "*" в версии = невоспроизводимая сборка…
allow-wildcard-paths = true  # …но у внутренних path-зависимостей версии нет по построению
deny = [
    # L-7: pre-release крипто в релизном бинаре. Такие версии не покрываются advisory-базой по
    # диапазонам и меняют API/поведение между rc — в продукте им места нет.
    { crate = "openssl", reason = "крипта проекта — aws-lc-rs; OpenSSL-C в дереве быть не должно" },
    { crate = "openssl-sys", reason = "то же: никаких C-OpenSSL зависимостей" },
    # ring уже НЕ в дереве (rcgen переведён на бэкенд aws_lc_rs) — бан держит его вне дерева:
    # два независимых крипто-бэкенда в одном бинаре = двойная поверхность аудита и обновлений.
    { crate = "ring", reason = "дублирующий крипто-бэкенд (используем aws-lc-rs)" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
